<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carousel Card Slider GSAP 1:1 - Klinik Pratama</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- GSAP Animation Engine CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <!-- Google Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              500: '#0ea5e9',
              600: '#0284c7',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>
  
  <style>
    /* 3D Stage Perspective Setup for GSAP Transitions */
    .carousel-stage {
      perspective: 1200px;
      perspective-origin: 50% 50%;
    }
    
    /* Base Card CSS Properties (Transforms handled exclusively via GSAP) */
    .card-item {
      transform-style: preserve-3d;
      will-change: transform, opacity, filter;
      backface-visibility: hidden;
    }

    /* Content reveal elements performance optimization */
    .card-tag, .card-title, .card-desc {
      will-change: transform, opacity, filter;
    }

    /* Gradient overlay for bottom readable text */
    .card-overlay-gradient {
      background: linear-gradient(to top, rgba(0, 0, 0, 0.94) 0%, rgba(0, 0, 0, 0.65) 45%, rgba(0, 0, 0, 0.15) 80%, rgba(0, 0, 0, 0) 100%);
    }

    /* Custom Scrollbar for Modal */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="h-full flex flex-col font-sans antialiased selection:bg-sky-500 selection:text-white bg-slate-950 overflow-x-hidden">

  <header class="w-full bg-slate-900/80 backdrop-blur-md border-b border-slate-800/80 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-500 flex items-center justify-center text-white shadow-lg shadow-sky-500/20">
          <i class="fa-solid fa-layer-group text-lg"></i>
        </div>
        <div>
          <h1 class="font-heading font-bold text-base sm:text-lg text-white leading-none">GSAP Deck Card Switcher</h1>
          <p class="text-xs text-slate-400 mt-0.5">Klinik Pratama Healthcare Showcase</p>
        </div>
      </div>

      <!-- Quick Control Tools -->
      <div class="flex items-center space-x-2 sm:space-x-3">
        <button id="btn-autoplay" onclick="toggleAutoplay()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium border border-slate-700/60 transition flex items-center gap-2">
          <i id="autoplay-icon" class="fa-solid fa-play text-sky-400"></i>
          <span id="autoplay-text" class="hidden sm:inline">Play Auto</span>
        </button>

        <button onclick="openEditModal()" class="px-3 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-white text-xs font-semibold shadow-md shadow-sky-600/20 transition flex items-center gap-1.5">
          <i class="fa-solid fa-pen-to-square"></i>
          <span>Edit Slide</span>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 flex flex-col items-center justify-center p-4 sm:p-8 lg:p-12 relative overflow-hidden">
    <!-- Ambient Background Lighting -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-sky-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute top-1/3 left-1/4 w-[400px] h-[400px] bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-6xl mx-auto flex flex-col items-center">
      
      <!-- CAROUSEL CONTAINER -->
      <div class="relative w-full max-w-4xl mx-auto py-4 sm:py-8">
        
        <!-- Stage Wrapper -->
        <div id="carousel-stage" class="carousel-stage relative w-full h-[380px] sm:h-[460px] md:h-[520px] lg:h-[560px] flex items-center justify-center select-none touch-pan-y">
          <!-- Dynamic Deck Cards Injected by JS -->
        </div>

        <!-- FIXED STATIONARY NAVIGATION TOOLBAR OVERLAY (NEVER MOVES) -->
        <div class="absolute bottom-8 sm:bottom-12 lg:bottom-14 inset-x-0 z-40 px-6 sm:px-10 lg:px-12 pointer-events-none">
          <div class="w-full flex items-center justify-between pointer-events-auto">
            <!-- Left Prev Button -->
            <button id="nav-btn-prev" onclick="prevSlide()" aria-label="Previous Slide"
                    class="w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-black/40 hover:bg-black/75 border border-white/20 backdrop-blur-md text-white flex items-center justify-center transition-all duration-300 transform active:scale-95 shadow-xl group cursor-pointer">
              <i class="fa-solid fa-arrow-left text-sm sm:text-base group-hover:-translate-x-0.5 transition-transform"></i>
            </button>

            <!-- Center Indicators (Dots + Active Bar) -->
            <div id="nav-indicators" class="flex items-center space-x-2 sm:space-x-2.5 bg-black/40 backdrop-blur-md px-3.5 py-2 rounded-full border border-white/15 shadow-xl">
              <!-- Injected Dynamically JS -->
            </div>

            <!-- Right Next Button -->
            <button id="nav-btn-next" onclick="nextSlide()" aria-label="Next Slide"
                    class="w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-black/40 hover:bg-black/75 border border-white/20 backdrop-blur-md text-white flex items-center justify-center transition-all duration-300 transform active:scale-95 shadow-xl group cursor-pointer">
              <i class="fa-solid fa-arrow-right text-sm sm:text-base group-hover:translate-x-0.5 transition-transform"></i>
            </button>
          </div>
        </div>

      </div>

      <!-- Interactive Helper Tips -->
      <div class="mt-2 flex flex-wrap items-center justify-center gap-4 text-xs text-slate-400 bg-slate-900/50 px-4 py-2 rounded-full border border-slate-800/80 backdrop-blur-sm">
        <span class="flex items-center gap-1.5"><i class="fa-solid fa-wand-magic-sparkles text-sky-400"></i> Fixed Toolbar & Smooth GSAP 3D Deck</span>
        <span class="text-slate-700">•</span>
        <span class="flex items-center gap-1.5"><i class="fa-solid fa-hand-pointer text-sky-400"></i> Click/Drag Slide</span>
        <span class="text-slate-700">•</span>
        <span class="flex items-center gap-1.5"><i class="fa-solid fa-keyboard text-sky-400"></i> Panah Kiri / Kanan</span>
      </div>

    </div>
  </main>

  <!-- MODAL EDIT SLIDE -->
  <div id="edit-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-md flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
      <!-- Modal Header -->
      <div class="px-6 py-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/80">
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-sliders text-sky-400"></i>
          <h3 class="font-heading font-bold text-lg text-white">Kelola Content Slide</h3>
        </div>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-white w-8 h-8 rounded-lg hover:bg-slate-800 flex items-center justify-center transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <!-- Modal Body (Slide Select & Form) -->
      <div class="p-6 overflow-y-auto space-y-5 flex-1">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Pilih Slide Yang Ingin Diubah</label>
          <div id="modal-slide-tabs" class="flex gap-2 overflow-x-auto pb-1">
            <!-- Dynamic Slide Selector Buttons -->
          </div>
        </div>

        <hr class="border-slate-800">

        <!-- Form Fields -->
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Tagline / Subtitle Atas</label>
            <input type="text" id="edit-tag" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500 transition">
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Judul Utama</label>
            <input type="text" id="edit-title" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500 transition">
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Deskripsi Lengkap / Visi</label>
            <textarea id="edit-description" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500 transition resize-none"></textarea>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">URL Gambar Latar</label>
            <input type="text" id="edit-image" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500 transition">
          </div>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="px-6 py-4 border-t border-slate-800 bg-slate-900/80 flex items-center justify-between">
        <button onclick="resetDefaultData()" class="text-xs text-rose-400 hover:text-rose-300 flex items-center gap-1">
          <i class="fa-solid fa-rotate-left"></i> Reset Ke Default
        </button>
        <div class="flex items-center space-x-3">
          <button onclick="closeEditModal()" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 transition">Batal</button>
          <button onclick="saveSlideChanges()" class="px-5 py-2 rounded-xl bg-sky-600 hover:bg-sky-500 text-xs font-semibold text-white shadow-lg shadow-sky-600/20 transition">Simpan Perubahan</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Initial Slide Data (exact match for reference screenshot)
    const initialSlideData = [
      {
        id: 1,
        tag: "Layanan Unggulan Healthcare",
        title: "Fasilitas & Teknologi Medis Mutakhir",
        description: "Mendukung diagnosa cepat dan akurat dengan peralatan medis berstandar internasional demi keamanan serta kenyamanan utama setiap pasien.",
        image: "https://images.unsplash.com/photo-1516549655169-df83a0774514?auto=format&fit=crop&w=1600&q=80"
      },
      {
        id: 2,
        tag: "Misi Utama Klinik Pratama",
        title: "Pelayanan Kesehatan Terpadu",
        description: "Memberikan kemudahan akses dan kenyamanan dalam setiap tahapan perawatan kesehatan keluarga Anda dengan standar pelayanan profesional.",
        image: "https://images.unsplash.com/photo-1584515979956-d9f6e5d09982?auto=format&fit=crop&w=1600&q=80"
      },
      {
        id: 3,
        tag: "Visi Klinik Pratama Healthcare",
        title: "Menjadi Rumah Sakit Pilihan",
        description: "Menjadi Klinik Pratama pilihan masyarakat Yogyakarta dan sekitarnya dalam memberikan pelayanan kesehatan yang profesional, aman, terpercaya, dan berorientasi pada kebutuhan serta kenyamanan pasien.",
        image: "https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&w=1600&q=80"
      },
      {
        id: 4,
        tag: "SDM Medis Profesional",
        title: "Tim Dokter & Dokter Spesialis",
        description: "Didukung oleh spesialis medis berpengalaman tinggi dan berdedikasi untuk senantiasa mendampingi proses pemulihan kesehatan Anda.",
        image: "https://images.unsplash.com/photo-1622253692010-333f2da6031d?auto=format&fit=crop&w=1600&q=80"
      },
      {
        id: 5,
        tag: "Digital Healthcare Innovation",
        title: "Layanan Telemedicine & Konsultasi Online",
        description: "Kemudahan reservasi dokter, konsultasi jarak jauh, serta pengiriman resep obat langsung ke kediaman Anda secara efisien.",
        image: "https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=1600&q=80"
      }
    ];

    let slides = JSON.parse(localStorage.getItem('pratama_carousel_slides')) || [...initialSlideData];
    let currentIndex = 2; // Default starting at slide 3 (index 2)
    let isAutoplay = false;
    let autoplayTimer = null;
    let editingSlideId = 3;
    let isAnimating = false; // Prevents race conditions during transitions

    let cardElements = []; // Stores persistent card elements

    // Touch & Mouse Drag variables
    let startX = 0;
    let isDragging = false;

    function buildCarouselDOM() {
      const stage = document.getElementById('carousel-stage');
      stage.innerHTML = '';
      cardElements = [];

      const total = slides.length;

      slides.forEach((slide, idx) => {
        // Create Persistent Card Element
        const card = document.createElement('div');
        card.className = `card-item absolute w-full max-w-4xl h-full rounded-2xl sm:rounded-3xl overflow-hidden shadow-2xl border border-white/10 select-none bg-slate-900 cursor-pointer`;
        card.setAttribute('data-index', idx);

        // Click listener on cards
        card.onclick = () => {
          if (isAnimating) return;
          const diff = getOffset(idx, currentIndex, total);
          if (diff === -1) prevSlide();
          if (diff === 1) nextSlide();
        };

        // Inner Card Content HTML (Navigation Toolbar is NOT inside the card anymore)
        card.innerHTML = `
          <!-- Image Layer -->
          <img src="${slide.image}" 
               alt="${slide.title}" 
               class="card-img absolute inset-0 w-full h-full object-cover object-center pointer-events-none"
               onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?auto=format&fit=crop&w=1600&q=80';"
          />

          <!-- Gradient Overlay -->
          <div class="absolute inset-0 card-overlay-gradient pointer-events-none"></div>

          <!-- Gradual Backdrop Blur Layer (Multi-layer progressive blur) -->
          <div class="gradual-blur-overlay absolute inset-x-0 bottom-0 h-80 pointer-events-none overflow-hidden rounded-b-2xl sm:rounded-b-3xl z-0">
            <div class="absolute inset-0" style="mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 25%); -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 25%); backdrop-filter: blur(2px);"></div>
            <div class="absolute inset-0" style="mask-image: linear-gradient(to top, rgba(0,0,0,1) 15%, rgba(0,0,0,0) 50%); -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 15%, rgba(0,0,0,0) 50%); backdrop-filter: blur(5px);"></div>
            <div class="absolute inset-0" style="mask-image: linear-gradient(to top, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 75%); -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 75%); backdrop-filter: blur(10px);"></div>
            <div class="absolute inset-0" style="mask-image: linear-gradient(to top, rgba(0,0,0,1) 45%, rgba(0,0,0,0) 100%); -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 45%, rgba(0,0,0,0) 100%); backdrop-filter: blur(18px);"></div>
          </div>

          <!-- TOP RIGHT BADGE COUNTER -->
          <div class="absolute top-4 sm:top-6 right-4 sm:right-6 z-10 pointer-events-none">
            <div class="bg-black/50 backdrop-blur-md text-white border border-white/15 px-3 py-1 sm:px-3.5 sm:py-1.5 rounded-md text-xs sm:text-sm font-semibold tracking-widest font-mono shadow-md">
              <span class="card-badge-num">${idx + 1}</span> / ${total}
            </div>
          </div>

          <!-- BOTTOM CONTENT CONTAINER (Padded at bottom for stationary navigation bar) -->
          <div class="absolute bottom-0 inset-x-0 p-5 sm:p-8 lg:p-10 pb-20 sm:pb-24 lg:pb-28 z-10 flex flex-col justify-end text-left pointer-events-none">
            
            <!-- Tagline / Subtitle -->
            <p class="card-tag text-slate-300 text-xs sm:text-sm md:text-base font-medium tracking-wide mb-1 sm:mb-2 opacity-90 drop-shadow-sm">
              ${slide.tag}
            </p>

            <!-- Main Title -->
            <h2 class="card-title font-heading font-extrabold text-white text-2xl sm:text-3xl md:text-4xl lg:text-5xl leading-tight sm:leading-snug mb-2 sm:mb-3 drop-shadow-md">
              ${slide.title}
            </h2>

            <!-- Vision Description -->
            <p class="card-desc text-slate-200 text-xs sm:text-sm md:text-base leading-relaxed max-w-3xl font-normal opacity-90 line-clamp-3 sm:line-clamp-none drop-shadow">
              ${slide.description}
            </p>

          </div>
        `;

        stage.appendChild(card);
        cardElements.push(card);
      });

      // Render Fixed Stationary Nav Indicators
      renderStationaryIndicators();

      // Position cards initially without animation
      applyInitialPositions();
      updateDotIndicators();
      
      animateCardContent(currentIndex);
    }

    function renderStationaryIndicators() {
      const indicatorsContainer = document.getElementById('nav-indicators');
      indicatorsContainer.innerHTML = slides.map((_, i) => {
        return `<button onclick="goToSlide(${i});" aria-label="Go to slide ${i+1}" class="indicator-dot transition-all duration-300 cursor-pointer focus:outline-none"></button>`;
      }).join('');
    }

    function getOffset(idx, current, total) {
      let diff = idx - current;
      while (diff < -Math.floor(total / 2)) diff += total;
      while (diff > Math.floor((total - 1) / 2)) diff -= total;
      return diff;
    }

    function getSlotProperties(idx, current, total) {
      const diff = getOffset(idx, current, total);

      if (diff === 0) {
        // ACTIVE CENTER CARD
        return {
          xPercent: 0,
          scale: 1,
          z: 0,
          opacity: 1,
          filter: "blur(0px) brightness(1)",
          zIndex: 30,
          pointerEvents: "auto"
        };
      } else if (diff === -1) {
        // PREV CARD (LEFT)
        return {
          xPercent: -65,
          scale: 0.84,
          z: -120,
          opacity: 0.45,
          filter: "blur(2px) brightness(0.65)",
          zIndex: 20,
          pointerEvents: "auto"
        };
      } else if (diff === 1) {
        // NEXT CARD (RIGHT)
        return {
          xPercent: 65,
          scale: 0.84,
          z: -120,
          opacity: 0.45,
          filter: "blur(2px) brightness(0.65)",
          zIndex: 20,
          pointerEvents: "auto"
        };
      } else if (diff < -1) {
        // HIDDEN DEEP LEFT
        return {
          xPercent: -130,
          scale: 0.68,
          z: -250,
          opacity: 0,
          filter: "blur(5px) brightness(0.3)",
          zIndex: 10,
          pointerEvents: "none"
        };
      } else {
        // HIDDEN DEEP RIGHT
        return {
          xPercent: 130,
          scale: 0.68,
          z: -250,
          opacity: 0,
          filter: "blur(5px) brightness(0.3)",
          zIndex: 10,
          pointerEvents: "none"
        };
      }
    }

    function applyInitialPositions() {
      const total = slides.length;
      cardElements.forEach((card, idx) => {
        const slot = getSlotProperties(idx, currentIndex, total);
        gsap.set(card, {
          xPercent: slot.xPercent,
          scale: slot.scale,
          z: slot.z,
          opacity: slot.opacity,
          filter: slot.filter,
          zIndex: slot.zIndex
        });
        card.style.pointerEvents = slot.pointerEvents;
      });
    }

    function goToSlide(targetIndex) {
      if (isAnimating) return;
      targetIndex = (targetIndex + slides.length) % slides.length;
      if (targetIndex === currentIndex) return;

      isAnimating = true;

      const prevIndex = currentIndex;
      currentIndex = targetIndex;
      const total = slides.length;

      const oldActiveCard = cardElements[prevIndex];
      const newActiveCard = cardElements[currentIndex];

      // Kill any remaining tweens for a clean deterministic state
      cardElements.forEach(card => gsap.killTweensOf(card));

      // Master GSAP Timeline for Deck Card Switcher Effect
      const tl = gsap.timeline({
        onComplete: () => {
          isAnimating = false;
          resetAutoplayTimer();
        }
      });

      // PHASE 1: Recede the old active card into the deck slightly first
      tl.to(oldActiveCard, {
        scale: 0.80,
        z: -140,
        filter: "blur(2.5px) brightness(0.6)",
        duration: 0.2,
        ease: "power2.in"
      });

      // PHASE 2: Deterministic transition for all cards to their target slot
      cardElements.forEach((card, idx) => {
        const targetSlot = getSlotProperties(idx, currentIndex, total);

        tl.to(card, {
          xPercent: targetSlot.xPercent,
          scale: targetSlot.scale,
          z: targetSlot.z,
          opacity: targetSlot.opacity,
          filter: targetSlot.filter,
          duration: 0.5,
          ease: "power3.out",
          onStart: () => {
            if (idx === currentIndex) {
              card.style.zIndex = 30;
            } else if (idx === prevIndex) {
              card.style.zIndex = 20;
            } else {
              card.style.zIndex = targetSlot.zIndex;
            }
            card.style.pointerEvents = targetSlot.pointerEvents;
          }
        }, "<+=0.03");
      });

      // Sequential top-to-bottom slide-down reveal for active card text content
      animateCardContent(currentIndex);

      updateDotIndicators();
    }

    // Helper function for sequential slide-down & blurry reveal animation
    function animateCardContent(index) {
      const activeCard = cardElements[index];
      if (!activeCard) return;

      const tag = activeCard.querySelector('.card-tag');
      const title = activeCard.querySelector('.card-title');
      const desc = activeCard.querySelector('.card-desc');

      if (tag && title && desc) {
        // Reset and animate from top (y: -35, blur: 16px) to bottom position (y: 0, blur: 0px) sequentially
        gsap.fromTo([tag, title, desc], 
          { 
            y: -35, 
            opacity: 0,
            filter: "blur(16px)",
            scale: 0.98
          }, 
          { 
            y: 0, 
            opacity: 1, 
            filter: "blur(0px)",
            scale: 1,
            duration: 0.6, 
            stagger: 0.12, 
            ease: "power3.out", 
            delay: 0.15 
          }
        );
      }
    }

    function prevSlide() {
      goToSlide(currentIndex - 1);
    }

    function nextSlide() {
      goToSlide(currentIndex + 1);
    }

    function updateDotIndicators() {
      const dots = document.querySelectorAll('#nav-indicators .indicator-dot');
      dots.forEach((dot, idx) => {
        if (idx === currentIndex) {
          dot.className = "indicator-dot w-6 sm:w-8 h-1.5 sm:h-2 bg-white rounded-full transition-all duration-300 shadow-sm cursor-default";
        } else {
          dot.className = "indicator-dot w-1.5 sm:w-2 h-1.5 sm:h-2 bg-white/40 hover:bg-white/80 rounded-full transition-all duration-300 cursor-pointer";
        }
      });
    }

    // Autoplay Timer Logic
    function toggleAutoplay() {
      isAutoplay = !isAutoplay;
      const btnIcon = document.getElementById('autoplay-icon');
      const btnText = document.getElementById('autoplay-text');

      if (isAutoplay) {
        btnIcon.className = "fa-solid fa-pause text-amber-400";
        btnText.innerText = "Pause Auto";
        startAutoplay();
      } else {
        btnIcon.className = "fa-solid fa-play text-sky-400";
        btnText.innerText = "Play Auto";
        stopAutoplay();
      }
    }

    function startAutoplay() {
      stopAutoplay();
      autoplayTimer = setInterval(() => {
        nextSlide();
      }, 4000);
    }

    function stopAutoplay() {
      if (autoplayTimer) clearInterval(autoplayTimer);
    }

    function resetAutoplayTimer() {
      if (isAutoplay) {
        startAutoplay();
      }
    }

    const stageContainer = document.getElementById('carousel-stage');

    // Desktop Mouse Drag
    stageContainer.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX;
    });

    stageContainer.addEventListener('mouseup', (e) => {
      if (!isDragging) return;
      const diffX = e.clientX - startX;
      if (diffX > 40) prevSlide();
      else if (diffX < -40) nextSlide();
      isDragging = false;
    });

    stageContainer.addEventListener('mouseleave', () => {
      isDragging = false;
    });

    // Touch Mobile Swipe
    stageContainer.addEventListener('touchstart', (e) => {
      startX = e.touches[0].clientX;
    }, { passive: true });

    stageContainer.addEventListener('touchend', (e) => {
      const endX = e.changedTouches[0].clientX;
      const diffX = endX - startX;
      if (diffX > 35) prevSlide();
      else if (diffX < -35) nextSlide();
    }, { passive: true });

    // Keyboard Navigation Listener
    window.addEventListener('keydown', (e) => {
      if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;
      if (e.key === 'ArrowLeft') prevSlide();
      if (e.key === 'ArrowRight') nextSlide();
    });

    function openEditModal() {
      editingSlideId = slides[currentIndex].id;
      renderModalTabs();
      populateFormFields();
      
      const modal = document.getElementById('edit-modal');
      modal.classList.remove('opacity-0', 'pointer-events-none');
      modal.classList.add('opacity-100');
    }

    function closeEditModal() {
      const modal = document.getElementById('edit-modal');
      modal.classList.add('opacity-0', 'pointer-events-none');
      modal.classList.remove('opacity-100');
    }

    function renderModalTabs() {
      const tabsContainer = document.getElementById('modal-slide-tabs');
      tabsContainer.innerHTML = slides.map((slide) => {
        const isActive = slide.id === editingSlideId;
        return `
          <button onclick="switchEditingSlide(${slide.id})" 
                  class="px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition border ${
                    isActive 
                    ? 'bg-sky-600 text-white border-sky-500 shadow-md' 
                    : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-750'
                  }">
            Slide ${slide.id}
          </button>
        `;
      }).join('');
    }

    function switchEditingSlide(id) {
      editingSlideId = id;
      renderModalTabs();
      populateFormFields();
    }

    function populateFormFields() {
      const target = slides.find(s => s.id === editingSlideId);
      if (!target) return;

      document.getElementById('edit-tag').value = target.tag;
      document.getElementById('edit-title').value = target.title;
      document.getElementById('edit-description').value = target.description;
      document.getElementById('edit-image').value = target.image;
    }

    function saveSlideChanges() {
      const targetIdx = slides.findIndex(s => s.id === editingSlideId);
      if (targetIdx === -1) return;

      slides[targetIdx].tag = document.getElementById('edit-tag').value;
      slides[targetIdx].title = document.getElementById('edit-title').value;
      slides[targetIdx].description = document.getElementById('edit-description').value;
      slides[targetIdx].image = document.getElementById('edit-image').value;

      localStorage.setItem('pratama_carousel_slides', JSON.stringify(slides));

      // Update Card DOM text directly without destroying GSAP instance
      const card = cardElements[targetIdx];
      card.querySelector('.card-tag').innerText = slides[targetIdx].tag;
      card.querySelector('.card-title').innerText = slides[targetIdx].title;
      card.querySelector('.card-desc').innerText = slides[targetIdx].description;
      card.querySelector('.card-img').src = slides[targetIdx].image;

      closeEditModal();
    }

    function resetDefaultData() {
      slides = [...initialSlideData];
      localStorage.removeItem('pratama_carousel_slides');
      currentIndex = 2;
      buildCarouselDOM();
      closeEditModal();
    }

    // Initialize application on window load
    window.onload = function() {
      buildCarouselDOM();
    };
  </script>
</body>
</html>
